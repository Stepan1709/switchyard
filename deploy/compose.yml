name: switchyard

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: ../services/api
  image: switchyard-api:local
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  environment: &app-env
    ENV: ${ENV:-dev}
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_DB: ${POSTGRES_DB}
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    REDIS_HOST: redis
    REDIS_PASSWORD_FILE: /run/secrets/redis_password
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_USER: ${RABBITMQ_USER}
    RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
  secrets: [postgres_password, redis_password, rabbitmq_password]
  networks: [data]
  logging: *logging

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      # The official image reads the password from a file, so it never appears in environment.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *logging

  redis:
    image: redis:8.6.8-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    # The password is read from the secret file at start; sh -c is needed only for that substitution.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$(cat /run/secrets/redis_password)\" --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction"]
    secrets: [redis_password]
    volumes:
      - redis_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/redis_password)\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 192M}
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
    # The image no longer supports RABBITMQ_DEFAULT_PASS_FILE, so the wrapper renders a config
    # file (mode 600, owned by rabbitmq) from the secret before starting the broker.
    # A dedicated user is created instead of the default guest account.
    entrypoint:
      - sh
      - -c
      - |
        install -m 600 -o rabbitmq -g rabbitmq /dev/null /etc/rabbitmq/conf.d/20-credentials.conf
        printf 'default_user = %s\ndefault_pass = %s\n' "$$RABBITMQ_USER" "$$(cat /run/secrets/rabbitmq_password)" > /etc/rabbitmq/conf.d/20-credentials.conf
        exec docker-entrypoint.sh rabbitmq-server
    secrets: [rabbitmq_password]
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [data]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}
    logging: *logging

  # One-shot: applies migrations and exits. api starts only after it finishes successfully.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  api:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    # Only api gets the signing secret, the key pepper and the first admin password.
    secrets:
      - postgres_password
      - redis_password
      - rabbitmq_password
      - jwt_secret
      - key_pepper
      - admin_password
    environment:
      <<: *app-env
      SERVICE_NAME: api
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      KEY_PEPPER_FILE: /run/secrets/key_pepper
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 256M}

secrets:
  postgres_password:
    file: ./secrets/dev/postgres_password
  redis_password:
    file: ./secrets/dev/redis_password
  rabbitmq_password:
    file: ./secrets/dev/rabbitmq_password
  jwt_secret:
    file: ./secrets/dev/jwt_secret
  key_pepper:
    file: ./secrets/dev/key_pepper
  admin_password:
    file: ./secrets/dev/admin_password

networks:
  # No external access: services in this network are reachable only from other containers.
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
