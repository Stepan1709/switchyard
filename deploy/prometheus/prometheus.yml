# Scrapes the three Switchyard processes over the internal network.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8001"]}]
  - job_name: gateway
    static_configs: [{targets: ["gateway:8000"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:8004"]}]
