# The only entry point in production: TLS, the paths that are published, rate limits.
#
#   /v1/      the OpenAI-compatible gateway (applications use this as base_url)
#   /api/     the admin API (prefix removed)
#   /         the web interface
#   /metrics  never published (Prometheus scrapes the services inside the network)
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Access log without the query string (it can carry tokens) and without bodies.
    log_format main '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 75s;

    # Failed logins are the thing to slow down: only POSTs to the login forms are counted.
    map $request_method $login_key {
        POST $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_key zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin:10m rate=30r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    upstream gateway { server gateway:8000; keepalive 64; }
    upstream api     { server api:8001;     keepalive 16; }
    upstream web     { server web:8002;     keepalive 16; }

    # The proxy sets the client address itself (it replaces what the client sent), which is
    # what makes TRUST_FORWARDED_FOR safe in the services behind it.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The services set some of the security headers themselves; nginx sets them once for all.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;

    server {
        listen 80 default_server;
        server_name _;

        # Let's Encrypt validation (certbot writes the challenge files here).
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ssl:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        client_max_body_size 10m;

        location ~ ^/(.*/)?metrics$ {
            return 404;
        }

        # Streaming answers must reach the client as they are produced, and a model can think
        # for minutes before the first byte: no buffering, long timeouts.
        location /v1/ {
            proxy_pass http://gateway;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 330s;
            proxy_send_timeout 330s;
        }

        location = /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
        }

        location /api/ {
            limit_req zone=admin burst=60 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api;
        }

        location = /login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://web;
        }

        location / {
            limit_req zone=admin burst=60 nodelay;
            proxy_pass http://web;
        }
    }
}
