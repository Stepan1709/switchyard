name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the one job that publishes the coverage badge asks for more itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: copy

jobs:
  # Style and types, per service.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, mock_llm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: uv sync --frozen
      - name: Ruff
        working-directory: services/${{ matrix.service }}
        run: |
          uv run ruff check --config ../../ruff.toml .
          uv run ruff format --config ../../ruff.toml --check .
      - name: mypy
        working-directory: services/${{ matrix.service }}
        run: uv run mypy app tests

  # No secrets in the history or in the changes.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The deployment files: compose (dev and production), nginx, shell scripts.
  deploy-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose files are valid and every service rotates its logs
        run: |
          make env secrets
          python3 scripts/check_compose.py deploy/compose.yml deploy/compose.dev.yml
          mkdir -p /tmp/swy/secrets /tmp/swy/tls
          for n in postgres_password redis_password rabbitmq_password jwt_secret key_pepper admin_password master_keys; do echo x > /tmp/swy/secrets/$n; done
          printf 'IMAGE_REPO=ghcr.io/example\nSWITCHYARD_VERSION=v0.0.0\nSECRETS_DIR=/tmp/swy/secrets\nTLS_DIR=/tmp/swy/tls\nPOSTGRES_USER=u\nPOSTGRES_DB=d\nRABBITMQ_USER=u\nADMIN_EMAIL=a@example.com\nCOMPOSE_PROFILES=backup\n' > /tmp/swy/prod.env
          docker compose --env-file /tmp/swy/prod.env -f deploy/compose.yml -f deploy/compose.prod.yml config --quiet
      - name: nginx accepts its configuration
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout /tmp/swy/tls/privkey.pem -out /tmp/swy/tls/fullchain.pem 2>/dev/null
          docker run --rm --add-host gateway:127.0.0.1 --add-host api:127.0.0.1 --add-host web:127.0.0.1 \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" -v /tmp/swy/tls:/etc/nginx/tls:ro \
            nginx:1.30.6-alpine nginx -t
      - name: Prometheus rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" prom/prometheus:v3.15.1 check rules /p/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p:ro" prom/prometheus:v3.15.1 check config /p/prometheus.yml
      - name: Shell scripts
        run: shellcheck deploy/prod/*.sh deploy/backup/*.sh

  # Unit and integration tests. The api and web suites start PostgreSQL, Redis and RabbitMQ in
  # containers; the coverage of every service must stay above its threshold.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mock_llm
            threshold: 90
          - service: web
            threshold: 85
          - service: api
            threshold: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/*/uv.lock
      - name: Install
        run: |
          (cd services/${{ matrix.service }} && uv sync --frozen)
          # the web integration tests run the real api from its own environment
          if [ "${{ matrix.service }}" = web ]; then (cd services/api && uv sync --frozen); fi
      - name: Tests
        working-directory: services/${{ matrix.service }}
        run: uv run pytest -q --cov-fail-under=${{ matrix.threshold }} --cov-report=xml --cov-report=term
      - name: Coverage
        if: always()
        run: |
          python3 - <<'PY' > coverage-${{ matrix.service }}.txt
          import xml.etree.ElementTree as ET
          root = ET.parse("services/${{ matrix.service }}/coverage.xml").getroot()
          print(round(float(root.get("line-rate", 0)) * 100))
          PY
          cat coverage-${{ matrix.service }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.txt

  # The images build, and have no known fixable serious vulnerabilities.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: api, context: services/api}
          - {name: web, context: services/web}
          - {name: mock-llm, context: services/mock_llm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: switchyard-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: switchyard-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # The whole path of the product on a running stack: project, key, recorded traffic,
  # calibration, recommendation, rule, routed traffic, savings; then a backup is restored.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install the script environment
        run: cd services/api && uv sync --frozen
      - name: Start the stack
        run: make up
      - name: End to end
        run: make e2e
      - name: A backup can be restored
        run: make backup-check
      - name: Logs of the stack (on failure)
        if: failure()
        run: make logs-dump

  # Main only: the coverage figures become the badge in the README (a file on the `badges`
  # branch that shields.io reads).
  badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Write the badge
        run: |
          api=$(cat coverage-api.txt)
          color=red
          [ "$api" -ge 70 ] && color=yellow
          [ "$api" -ge 85 ] && color=green
          mkdir -p /tmp/badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$api" "$color" > /tmp/badge/coverage.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin badges || true
          if git rev-parse --verify origin/badges >/dev/null 2>&1; then
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null
          fi
          cp /tmp/badge/coverage.json coverage.json
          git add coverage.json
          git commit -m "Update the coverage badge" || exit 0
          git push origin badges
