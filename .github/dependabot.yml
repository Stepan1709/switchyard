version: 2
updates:
  # The services pin exact versions in pyproject.toml and uv.lock; Dependabot proposes bumps.
  - package-ecosystem: uv
    directory: /services/api
    schedule: {interval: weekly}
    groups:
      python-api: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /services/web
    schedule: {interval: weekly}
    groups:
      python-web: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /services/mock_llm
    schedule: {interval: weekly}
    groups:
      python-mock-llm: {patterns: ["*"]}
  - package-ecosystem: uv
    directory: /loadtest
    schedule: {interval: monthly}
  # Base images in the Dockerfiles.
  - package-ecosystem: docker
    directory: /services/api
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /services/web
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /services/mock_llm
    schedule: {interval: weekly}
  # The actions are pinned to commits; Dependabot proposes the new commits with their versions.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
