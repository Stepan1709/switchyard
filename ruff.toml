line-length = 100
target-version = "py312"
extend-exclude = ["learning"]

[lint]
# E/F/W: pycodestyle+pyflakes, I: imports, B: bugbear, UP: pyupgrade,
# ASYNC: blocking calls inside coroutines (project rule: async only), SIM/C4/RUF: simplifications.
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "C4", "SIM", "RUF"]

[lint.per-file-ignores]
# Autogenerated migrations keep Alembic's long lines.
"**/migrations/versions/*.py" = ["E501"]
# Tests keep readable one-line assertions and request bodies.
"**/tests/**" = ["E501", "C408"]  # dict(status=...) reads better for test data

# Helper scripts (not part of the application) may use long lines and plain file reads.
"scripts/*.py" = ["E501", "ASYNC240"]
"loadtest/*.py" = ["E501"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
